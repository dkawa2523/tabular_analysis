# train task config (single model)
defaults:
  - run: local
  - _self_

usecase_id: tabular-analysis

data:
  dataset_id: null
  local_path: null
  format: parquet
  target_col: target
  id_col: null
  group_col: null
  feature_cols: null

model:
  name: lightgbm
  params:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    random_state: 42

train:
  split:
    kind: kfold
    n_splits: 5
    shuffle: true
    seed: 42
  metrics:
    primary: rmse
    others: [mae, r2]
  save_oof_predictions: true

output:
  out_dir: outputs/train
