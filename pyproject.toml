[project]
name = "ml-solution-template"
version = "0.1.0"
description = "Usecase solution repo template using ml-platform"
requires-python = ">=3.10"
# Platform dependency (pin in production, editable install for dev)
dependencies = [
    "ml-platform",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
